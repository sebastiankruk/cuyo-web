name: Release

# Publishing a release is a consequence of landing on `main`, not a separate manual
# step. The tag and the GitHub release are the same event, so making one manual and the
# other automatic is how they end up disagreeing.
#
# On the rule that only `release/*` may merge to `main`:
#
# This workflow *checks* that rule rather than relying on it, because GitHub has no
# setting for it. Branch protection can require a pull request, reviews and status
# checks, but it cannot say "only branches matching this pattern may be merged" — that
# would let anyone who can open a pull request choose the source branch, which is the
# thing the rule exists to prevent. So the check lives here: if the merge that bumped the
# version did not come from a `release/` branch, the release fails loudly and no tag is
# made.
#
# That is deliberately later than a failing status check on the pull request. A required
# check that is red on every non-release branch trains you to ignore red checks, and this
# project's whole gate philosophy is that a red gate means something. The release is the
# place where the mistake is expensive enough to be worth stopping for, so that is where it
# stops it.
#
# A merge is only *tried* as a release when it changed the version, so an ordinary
# merge finishes green and untouched. See the "Is this merge a release?" step for why
# keying on "this version has no tag" instead would be wrong for the first release.
#
# To enforce it earlier as well, add a required check to `main` — see the comment in
# `quality.yml`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to check and report on, e.g. 0.3.0"
        required: true

# Only one release at a time, and a queued run should not be cancelled after the tag
# exists — unlike the quality workflow, where cancelling is exactly right.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version bump is the thing that declares a release, and the way to know
          # whether this merge made one is to compare against the commit before it. That
          # comparison needs the parent, and when the merge commit has two parents the
          # shallow default of one commit will not supply it — so this fetches the whole
          # history. The repository is small enough that the clone is not worth
          # optimising, and a release gate that silently reads the wrong parent because
          # of a clone depth is exactly the kind of gate nobody trusts afterwards.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The version in package.json and the section in CHANGELOG.md are two sources of
      # truth, and the failure this prevents is a tag on `0.3.0` whose changelog entry is
      # still called [Unreleased] — a tag that points at something nobody can describe.
      #
      # So the release is not automatic until it is *possible*: getting one means
      # renaming the [Unreleased] heading and bumping package.json, which are two visible
      # edits in the same commit. That is the intent of the version being cut, made by a
      # person.
      - name: Check the version is consistent
        run: node scripts/check-version.mjs

      - name: Collect the changelog section
        id: notes
        run: |
          NOTES="$(node scripts/check-version.mjs --notes)"
          printf '%s\n' "$NOTES" > /tmp/notes.md
          echo "Release notes: $(wc -l < /tmp/notes.md) lines"
          head -3 /tmp/notes.md

      - name: Read the version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # A merge to main is a release only if it changed the version. Keying on "this
      # version has no tag" instead would be simpler and wrong for the first release:
      # nothing has ever been tagged here, so it would read every merge — including the
      # one that merges this file — as an attempt to release, and main would be red
      # before a release existed.
      #
      # Comparing against the parent commit also makes the rule self-maintaining. After
      # 0.3.0 is tagged, an ordinary feature merge leaves the version alone, so there is
      # nothing to do and the run is green. Only the merge that bumps the version tries
      # again, and only that one is subject to the branch gate below.
      - name: Is this merge a release?
        id: release
        if: github.event_name == 'push'
        run: |
          BEFORE="$(git show "${GITHUB_SHA}^:package.json" \
            | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')"
          AFTER="${VERSION_CURRENT}"
          echo "previous: ${BEFORE}"
          echo "current:  ${AFTER}"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "is-release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${AFTER} did not change; nothing to release."
          else
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${BEFORE} -> ${AFTER}: this merge is a release."
          fi
        env:
          VERSION_CURRENT: ${{ steps.version.outputs.version }}

      # Everything below only concerns an actual release. An ordinary merge stops here,
      # green, having done nothing.
      - name: Refuse unless the merge came from a release branch
        if: steps.release.outputs.is-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # `commits/{sha}/pulls` is how you find out which pull request a commit arrived
          # on, and it works on a push event — which is all this workflow has. A manual
          # dispatch has no merge behind it and is skipped, on the grounds that a person
          # deliberately asking for a release has already made that decision.
          HEADS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '.[].head.ref' || true)"
          if [ -z "$HEADS" ]; then
            echo "::error::A version was bumped by a direct push, not by a pull request."
            echo "::error::Releases are cut by merging a release/* branch into main."
            exit 1
          fi
          echo "Merged from: $(echo "$HEADS" | tr '\n' ' ')"
          if echo "$HEADS" | grep -qv '^release/'; then
            echo "::error::This commit came from a branch that is not release/*."
            echo "::error::Merged from: $(echo "$HEADS" | tr '\n' ' ')"
            echo "::error::Releases are cut by merging a release/* branch into main."
            exit 1
          fi

      - name: Skip if the tag already exists
        id: existing
        if: steps.release.outputs.is-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Idempotent on purpose. Re-running a release workflow must not fail, or the
          # one legitimate rerun — after fixing a typo in the notes — is indistinguishable
          # from a broken pipeline and gets ignored next time.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "already-released=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} already exists; nothing to do."
          else
            echo "already-released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the tag and the release
        if: steps.release.outputs.is-release == 'true' && steps.existing.outputs.already-released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The tag is created against the commit that triggered this run, not against
          # whatever `main` happens to be by the time the job gets a runner. Otherwise two
          # quick merges produce two releases claiming the same version from different
          # commits, and the tag silently points at the wrong one.
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file /tmp/notes.md \
            --target "${GITHUB_SHA}" \
            --verify-tag=false
          echo "Released v${VERSION} at ${GITHUB_SHA}"

      - name: Report
        if: always() && steps.release.outputs.is-release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SKIPPED: ${{ steps.existing.outputs.already-released }}
        run: |
          if [ "$SKIPPED" = "true" ]; then
            echo "::notice::v${VERSION} was already released; no tag created."
          else
            echo "::notice::Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          fi
